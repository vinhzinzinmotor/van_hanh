<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kiểm Hàng</title>
    <link rel="icon" type="image/png" href="logo.png" />
    <link rel="manifest" href="manifest.json" />

    <meta name="theme-color" content="#1d4ed8" />

    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <meta name="apple-mobile-web-app-title" content="Kiểm Hàng" />

    <link rel="apple-touch-icon" href="logo.png" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="styles_van_don_kiem_hang.css" />
  </head>
  <body>
    <div id="vignette-layer" class="vignette-error"></div>
    <!-- ════ HEADER ════ -->
    <div class="header">
      <div class="header-left">
        <div class="title">HỆ THỐNG KIỂM HÀNG</div>
        <div class="subtitle" id="sub-title">Hệ thống đang đồng bộ...</div>
      </div>
      <div style="display: flex; gap: 12px; align-items: center">
        <div class="ram-badge" id="ram-cache">MÃ VẬN ĐƠN: 0 mã</div>
        <button class="btn-back" onclick="window.location.href = 'index.html'">
          🔙 Trang chủ
        </button>
      </div>
    </div>

    <!-- ════ THANH NHẬP LIỆU ẨN (nhận input từ máy quét) ════ -->
    <div class="search-row">
      <input
        type="text"
        id="search-input"
        class="search-box"
        placeholder="🔫 BẮN MÃ VẠCH VÀO ĐÂY (mã vận đơn hoặc mã sản phẩm)..."
        autocomplete="off"
        autofocus
      />
      <button class="btn-clear-table" onclick="xoaGiaoDien()">🗑️ Xóa</button>
    </div>

    <!-- ════ THÔNG TIN ĐƠN HÀNG ĐANG KIỂM ════ -->
    <div id="don-hien-tai" class="don-hien-tai" style="display: none">
      <div class="don-info">
        <span class="don-label">📦 Mã Vận Đơn:</span>
        <span class="don-value" id="don-ma-van-don">—</span>
        <span class="don-label" style="margin-left: 20px">🧾 Mã Đơn Hàng:</span>
        <span class="don-value" id="don-ma-don-hang">—</span>
      </div>
      <div class="don-tien-do" id="don-tien-do">0 / 0 sản phẩm đã đủ hàng</div>
    </div>

    <!-- ════ LƯỚI THẺ SẢN PHẨM ════ -->
    <div class="the-grid" id="the-grid">
      <!-- Thẻ sản phẩm sẽ được render tại đây -->
    </div>

    <!-- ════ TRẠNG THÁI CHỜ ════ -->
    <div class="cho-quet" id="cho-quet">
      <div class="cho-quet-icon">🔫</div>
      <div class="cho-quet-text">Bắn mã vận đơn để bắt đầu kiểm hàng</div>
      <div class="cho-quet-sub" id="cho-quet-sub">
        Hệ thống đang nạp dữ liệu...
      </div>
    </div>

    <!-- ════ THÔNG BÁO HOÀN TẤT ════ -->
    <div class="hoan-tat-overlay" id="hoan-tat-overlay" style="display: none">
      <div class="hoan-tat-box">
        <div class="hoan-tat-icon">✅</div>
        <div class="hoan-tat-text">ĐỦ HÀNG!</div>
        <div class="hoan-tat-sub">Bắn mã vận đơn mới để tiếp tục</div>
      </div>
    </div>

    <!-- ════ THANH TRẠNG THÁI ════ -->
    <div class="status-bar" id="status-bar">Đang khởi động hệ thống...</div>

    <script src="script_van_don_kiem_hang.js"></script>
    <!-- 2. CHẠY FILE LỊCH SỬ SAU ĐỂ NGHE LÓNG -->
    <script src="script_lich_su_kiem_hang.js"></script>
  </body>
</html>
